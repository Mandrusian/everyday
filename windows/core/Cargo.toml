[package]
name = "everyday-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent logic of everyday., ported from the Swift EverydayCore. Tested on macOS, used by the Windows app."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
mail-parser = "0.9"
feed-rs = "2"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Desktop: the operating system's own secret store and TLS.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }
native-tls = "0.2"

# Android: secrets go through the app's Android Keystore wrapper (a SecretStore passed in from Kotlin),
# and TLS uses a bundled OpenSSL because the platform one isn't reachable from Rust.
[target.'cfg(target_os = "android")'.dependencies]
native-tls = { version = "0.2", features = ["vendored"] }
