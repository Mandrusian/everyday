[package]
name = "everyday-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent logic of everyday., ported from the Swift EverydayCore. Tested on macOS, used by the Windows app."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
mail-parser = "0.9"
feed-rs = "2"
native-tls = "0.2"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
