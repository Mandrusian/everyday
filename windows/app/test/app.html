<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>everyday.</title>
<style>
:root{--bg:#1c1b19;--raised:#25231f;--line:#33312c;--text:#ece8df;--text2:#a39e92;--accent:#d97757;--serif:ui-serif,Georgia,"Times New Roman",serif;--sans:"Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:light){:root{--bg:#f4f1e8;--raised:#fbf9f3;--line:#e2ddcf;--text:#141413;--text2:#6f6a5d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans)}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}
aside{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column}.brand{font:600 26px var(--serif);margin:0 8px 22px}.brand b{color:var(--accent)}
nav a{display:block;padding:7px 10px;border-radius:7px;color:var(--text2);cursor:pointer}nav a.on{background:var(--raised);color:var(--text)}
#status{margin-top:auto;color:var(--text2);font-size:13px;padding:8px 10px;cursor:pointer}
main{padding:28px 40px;overflow:auto}h1{font:400 38px var(--serif);margin:0 0 4px}p.sub{color:var(--text2);margin:0 0 20px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:6px 18px;max-width:820px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{color:var(--text2);display:block}.row .t{min-width:0}
button{font:600 14px var(--sans);border:0;border-radius:8px;padding:6px 12px;background:var(--line);color:var(--text);cursor:pointer}button.p{background:var(--accent);color:#1c1b19}button:disabled{opacity:.5}
.chip{display:inline-block;background:#3b2a22;color:#e8a184;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}
input,textarea{width:100%;max-width:820px;margin:6px 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--text);font:15px var(--sans)}
#hint,.muted{color:var(--text2)}.brief{font:400 20px/1.6 var(--serif);max-width:820px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.u{color:#e8916f;font-weight:600}.d{color:#e0a84a;font-weight:600}.pn{color:#7fb0d6;font-weight:600}.n{color:#8fc29a;font-weight:600}
.a{color:#e7aa83;font-weight:600}.m{color:#a8c785;font-weight:600}.l{color:#b4a3d8;font-weight:600}
.brief p{margin:8px 0 14px}.brief-heading{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:18px 0 4px}
.split{display:grid;grid-template-columns:360px 1fr;gap:18px}.list{max-height:78vh;overflow:auto}.sel{background:var(--bg)}
.deck{max-width:560px}.deck .card{padding:22px}.deck h2{font:400 28px var(--serif);margin:6px 0 10px}.bubble{padding:10px 14px;border-radius:12px;margin:8px 0;max-width:720px;white-space:pre-wrap}.me{background:var(--line)}.ai{background:var(--raised);border:1px solid var(--line)}
#wiz{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;z-index:5}#wiz>div{max-width:520px;width:90%}#wiz h1{font-size:34px}
#banner{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);padding:10px 16px;border-radius:12px;display:none;gap:12px;align-items:center}
</style></head><body><div class="app">
<aside><div class="brand">everyday<b>.</b></div><nav id="nav"><a data-v="today" class="on">Today</a><a data-v="inbox">Inbox</a><a data-v="news">News</a><a data-v="tasks">Tasks</a><a data-v="assistant">Ask everyday.</a><a data-v="settings">Settings</a></nav><div id="status">Connect mail in Settings</div></aside>
<main id="main"></main></div><div id="wiz"><div id="wizb"></div></div><div id="banner"><span id="bt"></span><button id="bu" style="display:none">Undo</button></div>
<script src="stub.js"></script><script src="../ui/format.js"></script><script src="../ui/main.js"></script></body></html>
