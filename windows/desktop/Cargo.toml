[package]
name = "everyday-desktop"
version = "0.2.0"
edition = "2021"
description = "everyday. for Windows: a native Slint interface over the shared Rust core. No WebView."

[[bin]]
name = "everyday"
path = "src/main.rs"

[dependencies]
everyday-core = { path = "../core" }
everyday-mobile = { path = "../mobile" }
slint = "1.18"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
qrcode = { version = "0.14", default-features = false }
open = "5"
rodio = { version = "0.20", default-features = false, features = ["wav"] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "everyday."
identifier = "app.everyday.windows"
icons = ["../app/icons/icon.ico", "../app/icons/icon.png"]
formats = ["nsis", "wix"]
out-dir = "../target/packages"
before-packaging-command = "cargo build --release -p everyday-desktop"
binaries = [{ path = "everyday", main = true }]
