name: Windows

# Builds everyday. for Windows from the same logic core the Mac app is checked against.
# Artifacts: an NSIS installer (.exe) and an MSI. They are unsigned until a code-signing certificate is added (see WINDOWS.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Test everyday-core
        run: cargo test -p everyday-core -p everyday-mobile --locked

  build:
    name: Build installer
    needs: core-tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      # Native Slint interface (no WebView), packaged as an NSIS installer and an MSI.
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Build
        run: cargo packager --release
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem ../target/packages -Include *.exe,*.msi -Recurse | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Append -Encoding ascii ../target/packages/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: everyday-windows
          path: |
            windows/target/packages/*.exe
            windows/target/packages/*.msi
            windows/target/packages/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: everyday-windows
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Only files: the artifact keeps the installers in nsis/ and msi/ folders.
        run: |
          mapfile -t files < <(find dist -type f)
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            && gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber --repo "${{ github.repository }}" \
            || gh release create "${{ github.ref_name }}" "${files[@]}" --repo "${{ github.repository }}" --title "everyday. ${{ github.ref_name }}" --notes "Unsigned Windows build. Windows SmartScreen will warn until the installer is code-signed."
